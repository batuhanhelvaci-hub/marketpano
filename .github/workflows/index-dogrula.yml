name: MarketPano index dogrulama

# SADECE ELLE. Anlik bir fotograf ceker: borsanin yayinladigi index ile
# ayni anda cekilen bilesen agirlik/fiyatlarindan hesapladigimiz index'i
# karsilastirir. Sonuc arsiv/index_dogrula/ altina zaman damgali yazilir
# ve Excel'deki "Index Dogrulama" sayfasina islenir.
#
# Gunluk otomatik cekim zaten "MarketPano gunluk" akisinda var.
# Bu akis, gun icinde istedigin anda ekstra fotograf almak icindir.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dogrula:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Paketleri kur
        run: pip install requests openpyxl
      - name: Index dogrulama
        run: python collect.py index_dogrula_github
      - name: Excel uret
        run: python build_excel.py
      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add arsiv/index_dogrula marketpano.xlsx || true
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "Index dogrulama: $(date -u +%Y-%m-%d\ %H:%M)"
            git push
          fi
