name: MarketPano gunluk

# Uc sekilde tetiklenir:
#   1) Her gun TR 12:00 (UTC 09:00) otomatik
#   2) borsa_local.json veya kontrat_local.json yuklendiginde (senin yuklemen)
#   3) Elle: Actions sekmesinden "Run workflow"
on:
  schedule:
    - cron: "0 9 * * *"
  push:
    paths:
      - "borsa_local.json"
      - "kontrat_local.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: pip install requests openpyxl

      - name: CMC verisi (ilk 150)
        run: python collect.py cmc

      - name: Hacim - GitHub borsalari (OKX, Bitget, Gate, Hyperliquid)
        run: python collect.py github

      - name: Kontrat ozellikleri - GitHub borsalari
        run: python collect.py kontrat_github

      - name: Arsivle (hacim + kontrat, bugunun kaydi)
        run: python collect.py arsivle

      - name: Excel uret (marketpano.xlsx)
        run: python build_excel.py

      - name: Degisiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cmc.json borsa_github.json kontrat_github.json marketpano.xlsx arsiv/ manuel-kaldirac.csv || true
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "Gunluk veri: $(date -u +%Y-%m-%d)"
            git push
          fi
