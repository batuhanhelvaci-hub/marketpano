name: MarketPano gunluk

# GUNLUK AKIS: sadece HACIM verisi (gun gun birikir) + Excel yeniden uretimi.
# Kontrat verisi BURADA CEKILMEZ - o tek fotograftir, "MarketPano kontrat guncelle"
# akisiyla sadece istendiginde yenilenir.
on:
  schedule:
    - cron: "0 9 * * *"        # her gun TR 12:00
  push:
    paths:
      - "borsa_local.json"
      - "hacim_local.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: pip install requests openpyxl

      - name: CMC verisi (ilk 150)
        run: python collect.py cmc

      - name: Pano hacmi - GitHub borsalari
        run: python collect.py github

      - name: Excel hacmi - her borsanin kendi ilk 150'si
        run: python collect.py hacim_github

      - name: Pano arsivi
        run: python collect.py arsivle

      - name: Hacim arsivi
        run: python collect.py arsivle_yeni

      - name: Excel uret
        run: python build_excel.py

      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cmc.json borsa_github.json hacim_github.json \
                  marketpano.xlsx manuel-kaldirac.csv arsiv/ || true
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "Gunluk hacim: $(date -u +%Y-%m-%d)"
            git push
          fi
